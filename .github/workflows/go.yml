name: gocode

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  Test:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x, 1.27.x]
        os: [ubuntu-latest, windows-latest, macos-11]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build 
      run: go build -v -o _testing/gocode

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Autocomplete regression tests
      working-directory: _testing
      shell: bash
      run: PATH="$GITHUB_WORKSPACE/_testing:$PATH" ruby run.rb
  
